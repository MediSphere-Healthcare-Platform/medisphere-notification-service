# Application Properties for Notification Service
spring.application.name=medisphere-notification-service

# Database Configuration (Neon PostgreSQL Cloud)
spring.datasource.url=jdbc:postgresql://ep-delicate-mountain-a1q5imc7-pooler.ap-southeast-1.aws.neon.tech:5432/notification_db?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_diF1rxTb0fps
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8087

# Logging Configuration (optional)
logging.level.org.springframework.web=DEBUG
logging.level.com.medisphere.notification=DEBUG

# Email Configuration (for actual sending)
# IMPORTANT: Replace these with your actual SMTP server details
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/